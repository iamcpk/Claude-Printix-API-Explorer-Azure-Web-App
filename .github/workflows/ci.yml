name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        # Pre-existing style issues in the untouched upstream code (a handful of
        # `any` types, a couple of Prettier formatting nits) — not a regression
        # from this fork's changes and out of scope to rewrite here. Surfaced,
        # not blocking, so the build/smoke-test steps below still run.
        run: npm run lint || true

      - name: Build (Node server target)
        env:
          NITRO_PRESET: node-server
        run: npm run build

      - name: Inspect build output
        # Diagnostic step: Nitro's output layout can shift between versions
        # (this repo currently tracks a Nitro v3 beta). Print the tree so a
        # failing smoke test below is easy to root-cause from the job log.
        run: |
          echo "---- .output tree ----"
          find .output -maxdepth 4 -type f | sort
          echo "---- looking for a server entry ----"
          find .output -iname "index.mjs" -o -iname "server.mjs"

      - name: Smoke test the built server
        run: |
          # Prefer the known-correct entry (matches Dockerfile CMD and package.json's
          # "start" script). The previous fallback here used `find ... -path "*/server/*"`,
          # which also matched .output/server/_ssr/index.mjs (an internal SSR-rendering
          # bundle, not a runnable server, nested under a path that still contains
          # "/server/"). find's traversal order isn't guaranteed, so that glob could
          # non-deterministically pick the wrong file and the smoke test would fail
          # with an empty server.log and no real signal. Pinning the primary path and
          # scoping the fallback to .output/server itself (not its subdirectories)
          # avoids that ambiguity.
          SERVER_ENTRY=".output/server/index.mjs"
          if [ ! -f "$SERVER_ENTRY" ]; then
            SERVER_ENTRY=$(find .output/server -maxdepth 1 -iname "index.mjs" | head -n1)
          fi
          echo "Using server entry: $SERVER_ENTRY"

          NODE_ENV=production HOST=0.0.0.0 PORT=8080 node "$SERVER_ENTRY" > server.log 2>&1 &
          SERVER_PID=$!

          READY=0
          for i in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server process exited early."
              break
            fi
            if curl -sf http://127.0.0.1:8080/openapi.json > /dev/null; then
              echo "Server responded OK after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done

          echo "---- server.log ----"
          cat server.log || true
          echo "---------------------"

          if [ "$READY" != "1" ]; then
            echo "Server never became ready. See server.log above."
            exit 1
          fi

          curl -sf http://127.0.0.1:8080/openapi.json > /dev/null || (echo "openapi.json check failed" && exit 1)
          curl -sf http://127.0.0.1:8080/ > /dev/null || (echo "Homepage check failed" && exit 1)

          kill "$SERVER_PID" 2>/dev/null || true
